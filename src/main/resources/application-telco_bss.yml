management:
  health:
    circuitbreakers:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

resilience4j.circuitbreaker:
  configs:
    default:
      registerHealthIndicator: true
      slidingWindowSize: 10
      automaticTransitionFromOpenToHalfOpenEnabled: true
      failureRateThreshold: 30
      minimumNumberOfCalls: 5
      permittedNumberOfCallsInHalfOpenState: 3
      waitDurationInOpenState: 5s
      ignoreExceptions:
        - com.adl.et.telco.dte.mvno.plugin.tmf.external.exception.AdaptorException
        - com.adl.et.telco.dte.mvno.plugin.tmf.application.exception.type.ControllerException
        - com.adl.et.telco.dte.mvno.plugin.tmf.domain.exception.DomainException
        - com.adl.et.telco.dte.mvno.plugin.tmf.application.exception.type.FilterException
        - com.adl.et.telco.dte.mvno.plugin.tmf.external.exception.RepositoryException
        - com.adl.et.telco.dte.mvno.plugin.tmf.external.exception.WebClientException
  instances:
    base_query:
      baseConfig: default
    base_get:
      baseConfig: default
    base_create:
      baseConfig: default
    base_patch:
      baseConfig: default
    base_delete:
      baseConfig: default

