        - com.adl.et.telco.dte.mvno.plugin.tmf.application.exception.type.FilterException
        - com.adl.et.telco.dte.mvno.plugin.tmf.external.exception.RepositoryException
        - com.adl.et.telco.dte.mvno.plugin.tmf.external.exception.WebClientException
  instances:
    base_query:
      baseConfig: default
    base_get:
      baseConfig: default
    base_create:
      baseConfig: default
    base_patch:
      baseConfig: default
    base_delete:
      baseConfig: default

