server:
  port: 31001
app:
  host: "localhost"
  protocol: "http"
  port: "31001"
  context:
    absolute: /tmf-api/productCatalogManagement/v4
    relative: /tmf-api/productCatalogManagement/v4
  swagger:
    title: Product Catalog Management
    description: "TMF API Reference: TMF620 - Product Catalog Management"
    version: 4.0.0
# Swagger UI: /swagger-ui.html - OpenAPI document: /v3/api-docs
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    # url and config-url are pinned so the UI resolves them even when it is opened directly on
    # /swagger-ui/index.html instead of through the /swagger-ui.html redirect
    url: /v3/api-docs
    # springdoc serves this configuration from SwaggerConfigResource, whose handler returns a Map
    # and is wrapped by the tmf-plugin LoggingAdvice, which casts the return to ResponseEntity and
    # answers 500. Until a plugin release carrying that fix is in use, the same configuration is
    # served as a static resource. Then drop this property together with
    # src/main/resources/static/swagger-config.json to go back to /v3/api-docs/swagger-config.
    config-url: /swagger-config.json
    disable-swagger-default-url: true
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: false
log:
  identifierKey: UUID
  isDebug: true
info:
  app:
    name :  base-template
    msName : base-template
